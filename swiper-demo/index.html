<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiper</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="images/works1.png" alt=""></div>
      <div class="swiper-slide"><img src="images/works2.png" alt=""></div>
      <div class="swiper-slide"><img src="images/works3.png" alt=""></div>
      <div class="swiper-slide"><img src="images/works4.jpg" alt=""></div>
      <div class="swiper-slide"><img src="images/works5.jpg" alt=""></div>
    </div>

    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="./main.js"></script>
</body>
</html>
